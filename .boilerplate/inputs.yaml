# Module configuration
# settings: # (Required) CloudWatch Contributor Insights configuration for the CIS alarm set.
#   log_group_name: "/aws/cloudtrail/organization" # (Required) Existing CloudWatch log group name that receives the CloudTrail events to analyze.
#   exclude: # (Optional) Per-rule exclusions. Exact lists are NotIn filters on Contributor Insights and, when a name-pattern list is set, also restrict that rule's directly filtered alarm metric. Pattern lists accept "*" in any position (or a "%regex%") and affect only the alarm; Contributor Insights/dashboard can still show pattern-excluded events. Default: omitted.
#     unauthorized_events: # (Optional) api_calls rule - CloudTrail event names ($.eventName) to ignore when evaluating unauthorized API activity. Default: [].
#       - "CreateUser"
#       - "DeleteUser"
#     unauthorized_sources: # (Optional) api_calls rule - AWS service eventSource values ($.eventSource) to ignore when evaluating unauthorized API activity. Default: [].
#       - "macie2.amazonaws.com"
#       - "cloud9.amazonaws.com"
#     security_groups: # (Optional) sg_changes rule - security group ids ($.requestParameters.groupId) to ignore. NOTE: CreateSecurityGroup does not carry groupId, so setting this drops CreateSecurityGroup from the rule. Default: [].
#       - "sg-0a1b2c3d4e5f6a7b8"
#     security_group_names: # (Optional) sg_changes rule - exact security group names ($.requestParameters.groupName) to ignore. Only create calls and legacy name-based calls carry groupName. Default: [].
#       - "eks-cluster-sg-prod"
#     security_group_name_patterns: # (Optional) Patterns for security-group names kept out of the CIS-Security-Group-Changes alarm. Uses a directly filtered CIS-Monitoring/CIS-Security-Group-Changes-Matched metric; exact SG exclusions also apply. Missing/null groupName values remain alarm candidates unless an exact exclusion requires field presence. NARROW BY DESIGN: CloudTrail carries groupName only on CreateSecurityGroup and legacy name-based Authorize/Revoke calls; VPC ID-only changes cannot be name-pattern matched. Default: [].
#       - "eks-cluster-sg-*" # starts with
#       - "*-tmp-sg" # ends with
#     iam_roles: # (Optional) iam_changes rule - exact IAM role names ($.requestParameters.roleName) to ignore. NOTE: non-role IAM events (CreateUser, CreatePolicy, CreateAccessKey, ...) do not carry roleName, so setting this narrows the rule to role events only. Default: [].
#       - "ci-deployer"
#     iam_role_patterns: # (Optional) Patterns for role names kept out of the CIS-IAM-Changes alarm. Uses a directly filtered CIS-Monitoring/CIS-IAM-Changes-Matched metric; exact IAM-role exclusions also apply. Missing/null roleName values remain alarm candidates unless the exact list requires field presence. Contributor Insights/dashboard can still show pattern-excluded events. Roles cannot be excluded by IAM path - match the role name instead. Default: [].
#       - "cognito-lambda-auth-*" # "*" at the end - starts with
#       - "*-exec-role" # "*" at the start - ends with
#       - "*exec*" # "*" at both ends - contains
#       - "exact-role-name" # no wildcard - exact match only
#       - "%^svc-[a-z]+-role$%" # percent signs - CloudWatch Logs regex, only for what "*" cannot express (character classes, alternation, anchors). Max 2 regex values; parentheses are rejected, group with "|".
#   rules: # (Optional) Per-rule switches. Every rule is enabled when omitted. Setting enabled to false removes that Contributor Insights rule, its metric alarm and its dashboard widget. Default: {}.
#     api_calls: # (Optional) Unauthorized API Calls - CIS-Unauthorized-API-Activity.
#       enabled: true # (Optional) Valid values: true, false. Default: true.
#     console_signin: # (Optional) Console Signin Without MFA - CIS-Console-Signin-Without-MFA.
#       enabled: true # (Optional) Valid values: true, false. Default: true.
#     root_activity: # (Optional) Root Activity - CIS-Root-Activity.
#       enabled: true # (Optional) Valid values: true, false. Default: true.
#     cloudtrail_changes: # (Optional) CloudTrail Configuration Changes - CIS-CloudTrail-Configuration-Changes.
#       enabled: true # (Optional) Valid values: true, false. Default: true.
#     console_failures: # (Optional) Console Authentication Failures - CIS-Console-Authentication-Failures.
#       enabled: true # (Optional) Valid values: true, false. Default: true.
#     cmk_delete: # (Optional) CMK Disabled or Deleted - CIS-CMK-Deletion-Disabling.
#       enabled: true # (Optional) Valid values: true, false. Default: true.
#     s3_policy_changes: # (Optional) S3 Bucket Policy Changes - CIS-S3-Bucket-Policy-Changes.
#       enabled: true # (Optional) Valid values: true, false. Default: true.
#     config_changes: # (Optional) AWS Config Configuration Changes - CIS-AWS-Config-Configuration-Changes.
#       enabled: true # (Optional) Valid values: true, false. Default: true.
#     sg_changes: # (Optional) Security Group Changes - CIS-Security-Group-Changes.
#       enabled: true # (Optional) Valid values: true, false. Default: true.
#     acl_changes: # (Optional) Network ACL Changes - CIS-Network-ACL-Changes.
#       enabled: true # (Optional) Valid values: true, false. Default: true.
#     network_gw: # (Optional) Network Gateway Changes - CIS-Network-Gateway-Changes.
#       enabled: true # (Optional) Valid values: true, false. Default: true.
#     route_table_changes: # (Optional) Route Table Changes - CIS-Route-Table-Changes.
#       enabled: true # (Optional) Valid values: true, false. Default: true.
#     vpc_changes: # (Optional) VPC Changes - CIS-VPC-Changes.
#       enabled: true # (Optional) Valid values: true, false. Default: true.
#     iam_changes: # (Optional) IAM Changes - CIS-IAM-Changes.
#       enabled: true # (Optional) Valid values: true, false. Default: true.
